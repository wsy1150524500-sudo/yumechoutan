<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>系统测试汇总图</title>
<style>
  body { 
    background: white; 
    display: flex; 
    justify-content: center; 
    align-items: flex-start;
    gap: 40px;
    padding: 30px;
    font-family: "Microsoft YaHei", sans-serif;
  }
  .chart-box { 
    width: 420px; 
    height: 380px; 
    background: white;
  }
</style>
</head>
<body>

<div class="chart-box">
  <canvas id="testSummary"></canvas>
</div>

<div class="chart-box">
  <canvas id="moduleDetail"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
// 左图：测试大类汇总环形图
new Chart(document.getElementById('testSummary').getContext('2d'), {
  type: 'doughnut',
  data: {
    labels: ['功能测试 (29项)', '安全测试 (5项)'],
    datasets: [{
      data: [29, 5],
      backgroundColor: ['#333333', '#999999'],
      borderColor: '#000000',
      borderWidth: 2
    }]
  },
  options: {
    responsive: true,
    plugins: {
      title: {
        display: true,
        text: ['系统测试汇总', '34项用例 · 通过率100%'],
        font: { size: 18, family: 'Microsoft YaHei', weight: 'bold' },
        color: '#000000'
      },
      legend: {
        position: 'bottom',
        labels: {
          font: { size: 15, family: 'Microsoft YaHei' },
          color: '#000000',
          padding: 20
        }
      },
      tooltip: {
        callbacks: {
          label: function(context) {
            return context.label + ' (' + Math.round(context.parsed / 34 * 100) + '%)';
          }
        }
      }
    }
  }
});

// 右图：各模块用例数柱状图
new Chart(document.getElementById('moduleDetail').getContext('2d'), {
  type: 'bar',
  data: {
    labels: ['用户模块', '游戏引擎', '管理后台', '社区模块', 'SQL注入', '权限控制'],
    datasets: [{
      label: '测试用例数',
      data: [9, 7, 7, 6, 2, 3],
      backgroundColor: '#333333',
      borderColor: '#000000',
      borderWidth: 1
    }]
  },
  options: {
    responsive: true,
    plugins: {
      title: {
        display: true,
        text: ['各模块测试用例分布', '全部通过'],
        font: { size: 18, family: 'Microsoft YaHei', weight: 'bold' },
        color: '#000000'
      },
      legend: { display: false }
    },
    scales: {
      x: {
        ticks: { 
          font: { size: 14, family: 'Microsoft YaHei' }, 
          color: '#000000' 
        },
        grid: { display: false }
      },
      y: {
        title: {
          display: true,
          text: '用例数',
          font: { size: 14, family: 'Microsoft YaHei' },
          color: '#000000'
        },
        ticks: { 
          font: { size: 13 }, 
          color: '#000000',
          stepSize: 2
        },
        grid: { color: '#e0e0e0' },
        beginAtZero: true,
        max: 12
      }
    }
  }
});
</script>
</body>
</html>
